# ---------------------------------------------------------------- E3

[quality]
root = "benchmarks/quality/results"
datasets = ["YouHQ40", "VideoLQ"]

# Łańcuch przyrostowy. Kolejność wpisów wyznacza kolejność wierszy w tabelach,
# a pole "change" opisuje różnicę względem szczebla poprzedniego.
[[quality.rung]]
file = "SR"
name = "bez kafelkowania"
change = "konfiguracja referencyjna"

[[quality.rung]]
file = "SR_flash_bs_none"
name = "+ kafelkowanie 192"
change = "podział klatki na kafle 192 z zakładką 24"

[[quality.rung]]
file = "SR_sage_bs_none"
name = "+ SageAttention"
change = "podmiana jądra uwagi gęstej"

[[quality.rung]]
file = "SR_sage_ss_none"
name = "+ SpargeAttention"
change = "podmiana selekcji rzadkiej"

[[quality.rung]]
file = "SR_sage_ss_int8dyn"
name = "+ INT8 wag i aktywacji"
change = "kwantyzacja wag i aktywacji"

# Gałąź boczna: rozmiar kafla przy konfiguracji drugiego szczebla.
[[quality.branch]]
file = "SR_tile160"
name = "kafelkowanie 160"
base = "SR_flash_bs_none"

[[quality.branch]]
file = "SR_tile128"
name = "kafelkowanie 128"
base = "SR_flash_bs_none"
