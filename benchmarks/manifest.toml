# Indeks wyników pomiarowych.
#
# Plik wiąże surowe pliki wynikowe z eksperymentami opisanymi w rozdziale 7.
# Pola opisujące platformę i liczbę przebiegów zostały uzupełnione ręcznie,
# ponieważ narzędzie pomiarowe nie rejestrowało ich w czasie wykonywania
# pomiarów. Dla nowych przebiegów pola te pochodzą wprost z plików wynikowych.

[meta]
# Pojemność karty docelowej. device_total_mib należy odczytać dokładnie:
#   torch.cuda.get_device_properties(0).total_memory / 1024**2
# cuda_context_mib to różnica między pamięcią zajętą przez proces a pulą
# alokatora, odczytana z komunikatów o przepełnieniu (ok. 270 MiB w obu).
# Progiem porównania dla max_memory_reserved jest budget_mib, ponieważ
# kontekst CUDA pozostaje poza pulą alokatora.
device_total_mib = 9871    # TODO: wstawić wartość dokładną
cuda_context_mib = 270
budget_mib = 9601
nominal_vram_gb = 10
reference_label = "flash/block_sparse/none"
frames = 101

